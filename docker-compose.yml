# Optional: a self-hosted (local) Telegram Bot API server.
#
# WHY: the public api.telegram.org caps *Bot API* uploads at 50 MB and
# downloads at 20 MB. Running this local server raises those to 2000 MB and
# lets the server read/write files by local path.
#
# NOTE: This bot uses Pyrogram, which talks MTProto directly to Telegram and
# already uploads up to 2 GB (4 GB Premium) WITHOUT this server — so you only
# need this if you switch to a Bot API based library (python-telegram-bot,
# aiogram, telebot, …). See README "Upload limits" for the full picture.
#
# Usage:
#   1. fill API_ID / API_HASH in .env
#   2. docker compose up -d telegram-bot-api
#   3. point your Bot API library at http://localhost:8081/bot<token>/...

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: 1          # serve files by local path, no size re-download
    command:
      - --local
      - --http-port=8081
    ports:
      - "8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
